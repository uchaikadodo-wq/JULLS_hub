name: lookin-base

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: mysql:8.4.13@sha256:a0225d1ea6631c8bc2385dc4c2faba17bbf1834ecf369e1659a9a382bd8d5dd7
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: bookstack
      MYSQL_USER: bookstack
      MYSQL_PASSWORD_FILE: /run/secrets/db_password
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
    secrets: [db_password, db_root_password]
    command:
      - --innodb-buffer-pool-size=128M
      - --innodb-log-buffer-size=16M
      - --max-connections=25
      - --table-open-cache=256
      - --performance-schema=OFF
      - --skip-name-resolve
      - --mysqlx=OFF
    volumes:
      - database:/var/lib/mysql
    tmpfs:
      - /var/run/mysqld:uid=999,gid=999,mode=0775,size=16m
      - /tmp:mode=1777,size=64m
    networks: [database]
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    pids_limit: 256
    logging: *logging
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$(cat /run/secrets/db_password)" mysql -h 127.0.0.1 -u bookstack bookstack -e "SELECT 1" >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  app:
    image: ${APP_IMAGE:?Set the versioned app image}
    build:
      context: ..
      dockerfile: server/Dockerfile
      target: app
    restart: unless-stopped
    user: "1000:1000"
    env_file: ${APP_ENV_FILE:?Set the protected app environment path}
    volumes:
      - storage:/app/storage
      - public_uploads:/app/public/uploads
    tmpfs:
      - /app/bootstrap/cache:uid=1000,gid=1000,mode=0770,size=16m
      - /tmp:mode=1777,size=96m
    networks: [application, database]
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 128
    logging: *logging
    healthcheck:
      test: [CMD, php, -r, '$$s=@fsockopen("127.0.0.1",9000,$$e,$$m,2);exit($$s?0:1);']
      interval: 15s
      timeout: 5s
      retries: 10

  web:
    image: ${WEB_IMAGE:?Set the matching versioned web image}
    build:
      context: ..
      dockerfile: server/Dockerfile
      target: web
    restart: unless-stopped
    user: "1000:1000"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set the agreed hostname}
      ACME_EMAIL: ${ACME_EMAIL:?Set an operations email for certificates}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - public_uploads:/srv/public/uploads:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs:
      - /tmp:mode=1777,size=64m
    networks: [ingress, application]
    depends_on:
      app:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 64
    logging: *logging

volumes:
  database: {}
  storage: {}
  public_uploads: {}
  caddy_data: {}
  caddy_config: {}

networks:
  ingress: {}
  application:
    internal: true
  database:
    internal: true

secrets:
  db_password:
    file: ${DB_PASSWORD_FILE:?Set protected database password file}
  db_root_password:
    file: ${DB_ROOT_PASSWORD_FILE:?Set protected root password file}
